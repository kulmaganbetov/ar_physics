<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#060912" rx="64"/>
  <!-- Atom nucleus -->
  <circle cx="256" cy="256" r="22" fill="#00d4ff"/>
  <!-- Electron orbit 1 -->
  <ellipse cx="256" cy="256" rx="140" ry="54" fill="none" stroke="#00d4ff" stroke-width="6" opacity="0.9"/>
  <!-- Electron orbit 2 (rotated 60deg) -->
  <ellipse cx="256" cy="256" rx="140" ry="54" fill="none" stroke="#00d4ff" stroke-width="6" opacity="0.9"
    transform="rotate(60 256 256)"/>
  <!-- Electron orbit 3 (rotated 120deg) -->
  <ellipse cx="256" cy="256" rx="140" ry="54" fill="none" stroke="#00d4ff" stroke-width="6" opacity="0.9"
    transform="rotate(120 256 256)"/>
  <!-- Electrons -->
  <circle cx="396" cy="256" r="13" fill="#00d4ff"/>
  <circle cx="186" cy="138" r="13" fill="#00d4ff"/>
  <circle cx="186" cy="374" r="13" fill="#00d4ff"/>
</svg>
