<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" fill="#060912" rx="24"/>
  <!-- Atom nucleus -->
  <circle cx="96" cy="96" r="8" fill="#00d4ff"/>
  <!-- Electron orbit 1 -->
  <ellipse cx="96" cy="96" rx="52" ry="20" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9"/>
  <!-- Electron orbit 2 (rotated 60deg) -->
  <ellipse cx="96" cy="96" rx="52" ry="20" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9"
    transform="rotate(60 96 96)"/>
  <!-- Electron orbit 3 (rotated 120deg) -->
  <ellipse cx="96" cy="96" rx="52" ry="20" fill="none" stroke="#00d4ff" stroke-width="2.5" opacity="0.9"
    transform="rotate(120 96 96)"/>
  <!-- Electrons -->
  <circle cx="148" cy="96" r="5" fill="#00d4ff"/>
  <circle cx="70" cy="51" r="5" fill="#00d4ff"/>
  <circle cx="70" cy="141" r="5" fill="#00d4ff"/>
</svg>
